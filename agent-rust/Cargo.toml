[package]
name = "opencommander"
version = "0.1.0"
edition = "2021"
description = "OpenCommander Windows Agent"

[[bin]]
name = "OpenCommander"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
sysinfo = "0.32"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
zip = "2"
walkdir = "2"
base64 = "0.22"
chrono = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
