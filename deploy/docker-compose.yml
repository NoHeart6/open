services:
  gateway:
    build: { context: .., dockerfile: deploy/gateway.Dockerfile }
    ports: ["8080:8080"]
    environment: [PORT=8080]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"], interval: 30s, retries: 3 }
  mcp:
    build: { context: .., dockerfile: deploy/mcp.Dockerfile }
    ports: ["8787:8787"]
    environment: [PORT=8787, GATEWAY_URL=http://gateway:8080]
    depends_on: [gateway]
